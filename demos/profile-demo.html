    /* ==========================================================================
       2. RESET & BASE LAYOUT STYLES
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.15s ease;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .app-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-content {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px 40px 24px;
    }

    /* Glassmorphism helpers */
    .glass {
      background: var(--surface-glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Animations */
    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.97);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-scale-in {
      animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .animate-slide-up {
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ==========================================================================
       3. NAVIGATION COMPONENT MODULE STYLES
       ========================================================================== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background-color: var(--surface);
      opacity: 0.95;
      border-bottom: 1px solid var(--border);
      z-index: 100;
      display: flex;
      align-items: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .nav-container {
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.125rem;
    }

    .logoIcon {
      color: var(--primary);
      display: inline-block;
      overflow: visible;
      animation: logoGentlyRock 6s infinite ease-in-out;
    }

    .giftLid {
      transform-origin: 4px 10px;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: giftLidBounce 6s infinite ease-in-out;
    }

    @keyframes logoGentlyRock {
      0%, 80%, 100% { transform: rotate(0deg); }
      85% { transform: rotate(-3deg); }
      90% { transform: rotate(3deg); }
      95% { transform: rotate(-1deg); }
    }

    @keyframes giftLidBounce {
      0%, 80%, 100% { transform: translateY(0) rotate(0deg); }
      85%, 95% { transform: translateY(-3px) rotate(-6deg); }
      90% { transform: translateY(-4px) rotate(-8deg); }
    }

    .logo:hover .logoIcon {
      animation: none;
    }

    .logo:hover .giftLid {
      animation: none;
      transform: translateY(-5px) rotate(-12deg);
    }

    .navLinks {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: 24px;
    }

    .navLink {
      font-size: 0.8125rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .navLink:hover {
      color: var(--text);
    }

    /* Search Input Wrapper */
    .search-container {
      flex: 1;
      margin: 0 2rem;
      position: relative;
      max-width: 42.5rem;
    }

    .search-input-wrapper {
      display: flex;
      align-items: center;
      background-color: var(--surface-hover);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
      width: 100%;
    }

    .search-input-wrapper:focus-within {
      border-color: var(--primary);
      background-color: var(--surface);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .search-icon {
      color: var(--text-muted);
      margin-right: 8px;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.8125rem;
      color: var(--text);
      font-family: inherit;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .clear-search-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      transition: color 0.15s ease;
    }

    .clear-search-btn:hover {
      color: var(--text);
    }

    /* Search Dropdown */
    .search-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background-color: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      max-height: 280px;
      overflow-y: auto;
      z-index: 1000;
      padding: 6px;
      display: none;
    }

    .dropdown-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      user-select: none;
    }

    .dropdown-item:hover, .active-dropdown-item {
      background-color: var(--surface-hover);
      transform: translateX(2px);
    }

    .dropdown-item-icon {
      color: var(--text-muted);
      flex-shrink: 0;
      transition: color 0.15s ease;
    }

    .dropdown-item:hover .dropdown-item-icon, .active-dropdown-item .dropdown-item-icon {
      color: var(--primary);
    }

    .dropdown-item-info {
      display: flex;
      flex-direction: column;
    }

    .dropdown-item-title {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text);
    }

    .dropdown-item-owner {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .dropdown-status {
      padding: 16px;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    /* Navigation Action Buttons */
    .navButton {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      transition: all 0.2s ease;
    }

    .navButton:hover {
      background-color: var(--surface-hover);
      color: var(--text);
    }

    .themeNavButton {
      position: relative;
    }

    .themeToggleWrapper {
      position: relative;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .paletteIcon {
      color: var(--text-muted);
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .navButton:hover .paletteIcon {
      color: var(--text);
      transform: rotate(15deg);
    }

    .miniIndicator {
      position: absolute;
      top: -4px;
      right: -4px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      padding: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      width: 12px;
      height: 12px;
      color: var(--primary);
      transition: all 0.2s ease;
    }

    .navButton:hover .miniIndicator {
      transform: scale(1.1);
    }

    /* Dropdowns */
    .dropdownContainer {
      position: relative;
      display: inline-block;
    }

    .profileTrigger {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 20px;
      transition: background-color 0.2s ease;
    }

    .profileTrigger:hover {
      background-color: var(--surface-hover);
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: var(--primary);
      color: var(--primary-text);
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }

    .chevron {
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .dropdownMenu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 200px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 6px;
      z-index: 101;
      display: none;
    }

    .themeMenu {
      width: 160px;
    }

    .menuHeader {
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 6px 8px;
      font-weight: 600;
    }

    .menuItem {
      display: flex;
      align-items: center;
      width: 100%;
      background: transparent;
      border: none;
      padding: 6px 8px;
      font-size: 0.8125rem;
      color: var(--text);
      text-align: left;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .menuItem:hover {
      background-color: var(--surface-hover);
    }

    .activeItem {
      color: var(--primary) !important;
      font-weight: 500;
      background-color: rgba(var(--primary-rgb), 0.05);
    }

    .menuItem:disabled {
      color: var(--text-muted);
      opacity: 0.5;
      cursor: not-allowed;
    }

    .menuItem:disabled:hover {
      background: transparent;
    }

    .menuDivider {
      height: 1px;
      background-color: var(--border);
      margin: 4px 0;
    }

    .itemIcon {
      margin-right: 8px;
      color: var(--text-muted);
    }

    .userInfo {
      padding: 8px;
    }

    .userName {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }

    .userEmail {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .dangerItem {
      color: var(--error);
    }

    .dangerItem:hover {
      background-color: var(--error-bg);
    }

    .lockIcon {
      margin-left: auto;
      color: var(--text-muted);
    }

    .holidayToggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
    }

    .rotatedChevron {
      transform: rotate(180deg);
    }

    .holidaySubMenu {
      padding-left: 6px;
      margin: 4px 0 4px 6px;
      border-left: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
      display: none;
    }

    .holidayMenuItem {
      padding-left: 10px;
    }

    /* ==========================================================================
       4. PAGE CONTAINER & PROFILE CARD COMPONENT STYLES
       ========================================================================== */
    .profile-container {
      display: flex;
      min-height: calc(100vh - 120px);
      align-items: center;
      justify-content: center;
    }

    .profileCard {
      width: 100%;
      max-width: 540px;
      margin: 40px auto;
    }

    .cardHeader {
      margin-bottom: 24px;
    }

    .cardTitle {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .cardSubtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Alert / Banner Messages */
    .alert {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      font-size: 0.8125rem;
      margin-bottom: 20px;
    }

    .alertError {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error);
    }

    .alertSuccess {
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success);
    }

    .alertIcon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Profile form layout */
    .profileForm {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .nameRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 540px) {
      .nameRow {
        grid-template-columns: 1fr;
      }
    }

    /* Shared Card Styles */
    .card {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glassCard {
      background: var(--surface-glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .cardPaddingLg {
      padding: 32px;
    }

    /* Shared Input Styles */
    .inputContainer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .inputLabel {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .inputWrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .inputField {
      width: 100%;
      font-family: inherit;
      font-size: 0.875rem;
      padding: 8px 12px;
      border-radius: var(--radius);
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .inputField:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.15);
    }

    .inputField:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .inputHasLeftIcon {
      padding-left: 36px;
    }

    .inputIcon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Shared Button Styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-weight: 500;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid transparent;
      gap: 8px;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      outline: none;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btnMd {
      padding: 8px 16px;
      font-size: 0.875rem;
    }

    .btnPrimary {
      background-color: var(--primary);
      color: var(--primary-text);
      border-color: var(--border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .btnPrimary:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btnPrimary:active:not(:disabled) {
      transform: translateY(0);
    }

    .submitBtn {
      align-self: flex-start;
      min-width: 140px;
      margin-top: 8px;
    }

    @media (max-width: 540px) {
      .submitBtn {
        width: 100%;
      }
    }

    /* Button Loading spinner animations */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 0.6s linear infinite;
    }

    .btnContent {
      display: inline-flex;
      align-items: center;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

  <script>
    // Initialize lucide icons on load
    lucide.createIcons();

    // Mock Wishlist search db
    const mockWishlists = [
      { Id: "1", Title: "Christmas 2026", OwnerUsername: "tech180" },
      { Id: "2", Title: "Mom's 60th Birthday", OwnerUsername: "tech180" },
      { Id: "3", Title: "Home Office Upgrade", OwnerUsername: "tech180" },
      { Id: "4", Title: "Sarah & John's Wedding", OwnerUsername: "sarah_m" },
      { Id: "5", Title: "Gaming Setup Fund", OwnerUsername: "alex_r" }
    ];

    // Setup interactive search functionality
    const searchInput = document.getElementById("nav-search-input");
    const clearSearchBtn = document.getElementById("nav-clear-search-btn");
    const searchDropdown = document.getElementById("nav-search-dropdown");
    const searchDropdownList = document.getElementById("nav-search-dropdown-list");
    let activeSearchIndex = 0;

    searchInput.addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase().trim();
      
      if (query === "") {
        clearSearchBtn.style.display = "none";
        searchDropdown.style.display = "none";
        return;
      }
      
      clearSearchBtn.style.display = "flex";
      searchDropdown.style.display = "block";
      
      const filtered = mockWishlists.filter(wl => 
        wl.Title.toLowerCase().includes(query) || 
        wl.OwnerUsername.toLowerCase().includes(query)
      );

      activeSearchIndex = 0;
      renderSearchResults(filtered, query);
    });

    searchInput.addEventListener("focus", () => {
      if (searchInput.value.trim() !== "") {
        searchDropdown.style.display = "block";
      }
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      clearSearchBtn.style.display = "none";
      searchDropdown.style.display = "none";
    });

    // Close search dropdown and click outside handlers
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#nav-search-ref")) {
        searchDropdown.style.display = "none";
      }
      if (!e.target.closest("#nav-theme-dropdown-container")) {
        document.getElementById("nav-theme-dropdown").style.display = "none";
      }
      if (!e.target.closest("#nav-profile-dropdown-container")) {
        document.getElementById("nav-profile-dropdown").style.display = "none";
      }
    });

    function renderSearchResults(results, query) {
      if (results.length === 0) {
        searchDropdownList.innerHTML = `<div class="dropdown-status">No wishlists found matching "${query}"</div>`;
        return;
      }

      searchDropdownList.innerHTML = results.map((wl, idx) => `
        <div class="dropdown-item ${idx === activeSearchIndex ? 'active-dropdown-item' : ''}" onclick="selectWishlist('${wl.Id}')">
          <i data-lucide="gift" class="dropdown-item-icon" style="width: 14px; height: 14px;"></i>
          <div class="dropdown-item-info">
            <span class="dropdown-item-title">${wl.Title}</span>
            <span class="dropdown-item-owner">@${wl.OwnerUsername}</span>
          </div>
        </div>
      `).join("");
      
      lucide.createIcons();
    }

    function selectWishlist(id) {
      const wl = mockWishlists.find(w => w.Id === id);
      alert(`Demo: Navigating to Wishlist "${wl.Title}"`);
      searchInput.value = "";
      clearSearchBtn.style.display = "none";
      searchDropdown.style.display = "none";
    }

    // Dropdown toggles
    const themeBtn = document.getElementById("nav-theme-btn");
    const themeDropdown = document.getElementById("nav-theme-dropdown");
    const profileBtn = document.getElementById("nav-profile-btn");
    const profileDropdown = document.getElementById("nav-profile-dropdown");

    themeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      closeDropdowns();
      themeDropdown.style.display = themeDropdown.style.display === "block" ? "none" : "block";
    });

    profileBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      closeDropdowns();
      profileDropdown.style.display = profileDropdown.style.display === "block" ? "none" : "block";
    });

    function closeDropdowns() {
      themeDropdown.style.display = "none";
      profileDropdown.style.display = "none";
    }

    // Holiday themes expand toggle
    let isHolidaySubmenuOpen = false;
    function toggleHolidaySubMenu(e) {
      e.stopPropagation();
      const chevron = document.getElementById("holiday-chevron");
      const submenu = document.getElementById("holiday-submenu-container");
      
      isHolidaySubmenuOpen = !isHolidaySubmenuOpen;
      if (isHolidaySubmenuOpen) {
        chevron.classList.add("rotatedChevron");
        submenu.style.display = "flex";
      } else {
        chevron.classList.remove("rotatedChevron");
        submenu.style.display = "none";
      }
    }

    // Set active theme handler
    function setAppTheme(themeName) {
      document.documentElement.setAttribute("data-theme", themeName);
      
      // Update active styling in dropdown
      const themeItems = document.querySelectorAll("#nav-theme-dropdown .menuItem");
      themeItems.forEach(item => {
        if (item.classList.contains("holidayToggle")) return;
        
        const spanText = item.querySelector("span")?.textContent.toLowerCase() || "";
        const formattedThemeName = themeName === "default" ? "linear" : themeName.replace("-", " ");
        
        if (spanText.includes(formattedThemeName)) {
          item.classList.add("activeItem");
        } else {
          item.classList.remove("activeItem");
        }
      });
      
      // Update color indicators
      const appearanceMini = document.getElementById("theme-appearance-mini-icon");
      appearanceMini.style.color = "var(--primary)";

      // Update avatar color in navbar
      document.getElementById("nav-avatar-initials").style.backgroundColor = "var(--primary)";
      
      closeDropdowns();
    }

    // Set appearance mode
    function setAppAppearance(mode) {
      document.documentElement.setAttribute("data-appearance", mode);
      
      const darkBtn = document.getElementById("appearance-btn-dark");
      const lightBtn = document.getElementById("appearance-btn-light");
      const miniIcon = document.getElementById("theme-appearance-mini-icon");
      
      if (mode === "dark") {
        darkBtn.classList.add("activeItem");
        lightBtn.classList.remove("activeItem");
        miniIcon.innerHTML = `<i data-lucide="moon" style="width: 10px; height: 10px;"></i>`;
      } else {
        lightBtn.classList.add("activeItem");
        darkBtn.classList.remove("activeItem");
        miniIcon.innerHTML = `<i data-lucide="sun" style="width: 10px; height: 10px;"></i>`;
      }
      
      lucide.createIcons();
      closeDropdowns();
    }

    // Handle profile form submit action
    function handleProfileSubmit(event) {
      event.preventDefault();
      
      const firstName = document.getElementById("first-name-input").value.trim();
      const lastName = document.getElementById("last-name-input").value.trim();
      const username = document.getElementById("username-input").value.trim();
      
      const errorAlert = document.getElementById("form-error-alert");
      const successAlert = document.getElementById("form-success-alert");
      const submitBtn = document.getElementById("submit-profile-btn");
      const submitContent = document.getElementById("submit-btn-content");

      errorAlert.style.display = "none";
      successAlert.style.display = "none";

      if (!firstName || !lastName || !username) {
        errorAlert.style.display = "flex";
        return;
      }

      // Simulate loading state
      submitBtn.disabled = true;
      submitContent.innerHTML = `<span class="spinner"></span>`;

      setTimeout(() => {
        // Restore button state
        submitBtn.disabled = false;
        submitContent.innerHTML = `Save Changes`;

        // Show success alert banner
        successAlert.style.display = "flex";

        // Update display items in navbar profile dropdown
        document.getElementById("dropdown-fullname").textContent = `${firstName} ${lastName}`;
        document.getElementById("dropdown-username").textContent = `@${username}`;

        // Update initials in avatar icon
        const initials = ((firstName[0] || "") + (lastName[0] || "")).toUpperCase();
        document.getElementById("nav-avatar-initials").textContent = initials || username[0].toUpperCase();

        // Autoclose success alert after 3 seconds
        setTimeout(() => {
          successAlert.style.display = "none";
        }, 3000);

      }, 1000);
    }
  </script>
</body>
</html>
